<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Downloads</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Familjen+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E8E4F5;
  --tinta:#17143A;
  --cobalto:#3A3AF0;
  --manteiga:#FFD84A;
  --branco:#FFFFFF;
  --borda:3px solid var(--tinta);
  --sombra:6px 6px 0 var(--tinta);
}
@media (prefers-color-scheme:dark){
  :root{--papel:#17143A;--tinta:#F2EFFF;--branco:#241F5C;--cobalto:#7B7BFF;--manteiga:#FFD84A}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:var(--papel);color:var(--tinta);
  font-family:"Familjen Grotesk",system-ui,sans-serif;font-size:1.05rem;line-height:1.55;
  background-image:radial-gradient(color-mix(in srgb,var(--tinta) 14%,transparent) 1.5px,transparent 1.5px);
  background-size:22px 22px;
}
.wrap{max-width:960px;margin:0 auto;padding:48px 20px 72px}
header{margin-bottom:44px}
h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
  font-size:clamp(3.2rem,12vw,7rem);line-height:.9;letter-spacing:-.04em;margin:0 0 18px;
}
h1 .sticker{
  display:inline-block;transform:rotate(-4deg);
  background:var(--manteiga);color:#17143A;border:var(--borda);border-color:#17143A;
  padding:0 .18em;margin-left:.1em;box-shadow:5px 5px 0 var(--tinta);
}
header p{max-width:46ch;margin:0;font-size:1.15rem}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.cartao{
  background:var(--branco);border:var(--borda);box-shadow:var(--sombra);
  padding:22px;display:flex;flex-direction:column;gap:12px;
  cursor:pointer;transition:transform .1s,box-shadow .1s;
}
.cartao:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--tinta)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tipo{
  font-weight:600;font-size:.9rem;background:var(--cobalto);color:#fff;
  padding:2px 10px;border:2px solid var(--tinta);border-radius:99px;
}
.versao{font-size:.95rem;opacity:.8}
.cartao h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
  font-size:1.6rem;line-height:1.1;letter-spacing:-.02em;margin:0;
}
.cartao p{margin:0;flex:1}
.meta{font-size:.92rem;opacity:.8;display:flex;gap:14px;flex-wrap:wrap}
.btn{
  font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;text-decoration:none;text-align:center;
  display:inline-block;padding:12px 18px;border:var(--borda);
  background:var(--manteiga);color:#17143A;border-color:var(--tinta);
  box-shadow:4px 4px 0 var(--tinta);transition:transform .08s,box-shadow .08s;
}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--tinta)}
.btn.sec{background:var(--branco);color:var(--tinta)}
:focus-visible{outline:4px solid var(--cobalto);outline-offset:3px}

dialog{
  border:var(--borda);box-shadow:10px 10px 0 var(--tinta);background:var(--branco);color:var(--tinta);
  padding:0;max-width:min(560px,94vw);width:100%;max-height:90vh;overflow:auto;
}
dialog::backdrop{background:rgba(23,20,58,.6)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
dialog h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.7rem;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
dialog p{margin:0 0 18px}
.acoes{display:flex;gap:12px;flex-wrap:wrap}
.m-previa{border-bottom:var(--borda);background:var(--cobalto);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.m-previa img{width:100%;height:100%;object-fit:cover;display:block}
.m-previa span{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(3rem,16vw,6rem);letter-spacing:-.04em;color:#fff}
.m-corpo{padding:24px 28px 28px}
.m-corpo .meta{margin-bottom:14px}
.m-detalhes{white-space:pre-line}
.vazio{border:var(--borda);border-style:dashed;padding:32px;text-align:center;background:var(--branco)}
footer{margin-top:56px;font-size:.92rem;opacity:.75}
[hidden]{display:none!important}
.menu-btn{font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:var(--borda);border-color:var(--tinta);background:var(--manteiga);color:#17143A;box-shadow:4px 4px 0 var(--tinta);margin-bottom:28px;transition:transform .08s,box-shadow .08s}
.menu-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.menu-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--tinta)}
.sec-titulo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:-.03em;line-height:1.05;margin:0 0 22px}
#menu{margin:0;inset:0 auto 0 0;height:100vh;height:100dvh;max-height:none;width:min(340px,88vw);max-width:none;border:0;border-right:var(--borda);box-shadow:8px 0 0 var(--tinta)}
#menu[open]{animation:desliza .2s ease-out}
@keyframes desliza{from{transform:translateX(-100%)}to{transform:none}}
.menu-corpo{padding:24px 22px 28px}
.menu-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.menu-topo h3{margin:0}
.menu-topo .btn{padding:6px 14px;font-size:.95rem;box-shadow:3px 3px 0 var(--tinta)}
.menu-topo .btn:hover{box-shadow:1px 1px 0 var(--tinta)}
.menu-topo .btn:active{box-shadow:0 0 0 var(--tinta)}
.sec-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:600;font-size:1.1rem;color:var(--tinta);background:var(--papel);border:var(--borda);padding:12px 14px;margin-bottom:16px;cursor:pointer;box-shadow:4px 4px 0 var(--tinta);transition:transform .08s,box-shadow .08s}
.sec-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.sec-btn[aria-current="true"]{background:var(--manteiga);color:#17143A}
.sec-btn .n{font-size:.9rem;border:2px solid var(--tinta);border-radius:99px;padding:0 9px;background:var(--branco);color:var(--tinta)}
.voltar{color:var(--cobalto);font-weight:600}
.pcard{background:var(--branco);border:var(--borda);box-shadow:var(--sombra);max-width:720px;margin-top:8px}
.pcard h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1;letter-spacing:-.03em;margin:0 0 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="barra">
    <button id="menu-abrir" class="menu-btn" type="button" aria-haspopup="dialog">
      <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1.5h20M0 7h20M0 12.5h20" stroke="#17143A" stroke-width="3"/></svg>
      Menu
    </button>
  </div>
  <header>
    <h1>Meus downloads<span class="sticker">grátis</span></h1>
    <p id="intro">Arquivos que eu publico. Escolha um, toque em baixar e pegue o link.</p>
  </header>

  <h2 id="sec-titulo" class="sec-titulo"></h2>

  <main id="grade" class="grade" aria-live="polite"></main>

  <section id="pagina" hidden></section>

  <footer>Para adicionar um download, publique pelo painel <code>dev/</code>.</footer>
</div>

<dialog id="modal" aria-labelledby="m-titulo">
  <div class="m-previa" id="m-previa"></div>
  <div class="m-corpo">
    <h3 id="m-titulo"></h3>
    <div class="meta" id="m-meta"></div>
    <p id="m-desc" class="m-detalhes"></p>
    <div class="acoes">
      <a id="m-link" class="btn" href="#" download>Baixar agora</a>
      <button id="m-copiar" class="btn sec" type="button">Copiar link do arquivo</button>
      <a id="m-abrir" class="btn sec" href="#" target="_blank" rel="noopener" hidden>Abrir página</a>
      <button id="m-copiar-pag" class="btn sec" type="button" hidden>Copiar link da página</button>
      <button id="m-fechar" class="btn sec" type="button">Fechar</button>
    </div>
  </div>
</dialog>

<dialog id="menu" aria-labelledby="menu-t">
  <div class="menu-corpo">
    <div class="menu-topo">
      <h3 id="menu-t">Sections</h3>
      <button id="menu-fechar" class="btn sec" type="button">Fechar</button>
    </div>
    <nav id="menu-lista" aria-label="Sections"></nav>
  </div>
</dialog>

<script>
/* ============================================================
   EDITE AQUI: cada item vira um cartão no site.
   "url" é o caminho do arquivo dentro da pasta download/ (ou um link externo).
   "detalhes" e "imagem" são opcionais.
   ============================================================ */
/* Link da lista que o painel dev atualiza sozinho (deixe "" para desligar). */
const JSON_URL = "https://raw.githubusercontent.com/Arthulypa/site-de-downloads/arquivos/downloads.json";

/* Downloads manuais (opcional): cole aqui os blocos copiados do painel dev. */
const DOWNLOADS = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grade = document.getElementById("grade");
const modal = document.getElementById("modal");
const mLink = document.getElementById("m-link");
const mDesc = document.getElementById("m-desc");
const mCopiar = document.getElementById("m-copiar");

let LISTA = [...DOWNLOADS];
const normSecao = t => { t = String(t ?? "").trim().replace(/\s+/g, " "); return t.toLowerCase() === "principal" ? "" : t; };
const menu = document.getElementById("menu");
const menuLista = document.getElementById("menu-lista");
let SEC = ""; /* "" = principal; senão o nome da section em minúsculas */

function outrasSecoes(){
  const m = new Map();
  LISTA.forEach(d => {
    const n = normSecao(d.secao);
    if (!n) return;
    const k = n.toLowerCase();
    if (!m.has(k)) m.set(k, { k, nome: n, n: 0 });
    m.get(k).n++;
  });
  return [...m.values()];
}

function desenhar(){
  const outras = outrasSecoes();
  if (SEC && !outras.some(s => s.k === SEC)) SEC = "";
  const atual = outras.find(s => s.k === SEC);
  document.getElementById("sec-titulo").textContent = atual ? atual.nome : "Principal";

  const nPrin = LISTA.filter(d => !normSecao(d.secao)).length;
  const itensMenu = [{ k: "", nome: "Principal", n: nPrin }, ...outras];
  menuLista.innerHTML = itensMenu.map(s =>
    `<button type="button" class="sec-btn" data-k="${esc(s.k)}" aria-current="${s.k === SEC}"><span>${esc(s.nome)}</span><span class="n">${s.n}</span></button>`).join("");

  const itens = LISTA.map((d, i) => [d, i]).filter(([d]) => normSecao(d.secao).toLowerCase() === SEC);
  if (!itens.length) {
    const msg = !LISTA.length ? "Nenhum download publicado ainda." : (SEC ? "Nenhum download nesta section." : "Nenhum download na principal.");
    grade.innerHTML = '<div class="vazio">' + msg + '</div>';
    return;
  }
  grade.innerHTML = itens.map(([d, i]) => `
    <article class="cartao" role="button" tabindex="0" data-i="${i}" aria-label="Ver detalhes de ${esc(d.nome)}">
      <div class="topo">
        <span class="tipo">${esc(d.tipo)}</span>
        <span class="versao">${esc(d.versao)}</span>
      </div>
      <h2>${esc(d.nome)}</h2>
      <p>${esc(d.descricao)}</p>
      <div class="meta"><span>${esc(d.tamanho)}</span><span>${esc(d.data)}</span></div>
      <button class="btn" type="button">Baixar</button>
    </article>`).join("");
}
desenhar();

document.getElementById("menu-abrir").addEventListener("click", () => menu.showModal());
document.getElementById("menu-fechar").addEventListener("click", () => menu.close());
menu.addEventListener("click", e => { if (e.target === menu) menu.close(); });
menuLista.addEventListener("click", e => {
  const b = e.target.closest(".sec-btn");
  if (!b) return;
  SEC = b.dataset.k;
  desenhar();
  menu.close();
  window.scrollTo({ top: 0 });
});

const ID = new URLSearchParams(location.search).get("d");
const secPagina = document.getElementById("pagina");

function copiar(btn, texto){
  const antes = btn.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject())
    .then(() => { btn.textContent = "Link copiado"; })
    .catch(() => { btn.textContent = "Não foi possível copiar"; })
    .finally(() => setTimeout(() => { btn.textContent = antes; }, 2000));
}

function rotear(carregado){
  if (!ID) return;
  document.getElementById("barra").hidden = true;
  document.getElementById("sec-titulo").hidden = true;
  document.querySelector("header").hidden = true;
  document.querySelector("footer").hidden = true;
  grade.hidden = true;
  secPagina.hidden = false;
  const d = LISTA.find(x => x.id === ID && x.pagina);
  if (!d) {
    secPagina.innerHTML = carregado
      ? '<div class="vazio">Download não encontrado.<br><br><a class="btn" href="./">Voltar aos downloads</a></div>'
      : '<div class="vazio">Carregando...</div>';
    return;
  }
  document.title = d.nome + " · Downloads";
  secPagina.innerHTML = `
    ${d.voltar !== false ? '<p><a class="voltar" href="./">Voltar aos downloads</a></p>' : ""}
    <article class="pcard">
      <div class="m-previa">${d.imagem ? `<img src="${esc(d.imagem)}" alt="Prévia de ${esc(d.nome)}">` : `<span>${esc(d.tipo)}</span>`}</div>
      <div class="m-corpo">
        <h2>${esc(d.nome)}</h2>
        <div class="meta">${[d.tipo, d.versao, d.tamanho, d.data].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div>
        <p class="m-detalhes">${esc(d.detalhes || d.descricao)}</p>
        <div class="acoes">
          <a class="btn" href="${esc(d.url)}" download>Baixar agora</a>
          <button class="btn sec" id="p-copiar-pag" type="button">Copiar link da página</button>
          <button class="btn sec" id="p-copiar-arq" type="button">Copiar link do arquivo</button>
        </div>
      </div>
    </article>`;
  document.getElementById("p-copiar-pag").onclick = e => copiar(e.target, location.href);
  document.getElementById("p-copiar-arq").onclick = e => copiar(e.target, new URL(d.url, location.href).href);
}

rotear(!JSON_URL);

if (JSON_URL) {
  fetch(JSON_URL, { cache: "no-store" })
    .then(r => r.ok ? r.json() : [])
    .then(rem => {
      if (!Array.isArray(rem)) return;
      rem = rem.filter(d => d && typeof d.url === "string" && !/^\s*javascript:/i.test(d.url));
      const urls = new Set(rem.map(d => d.url));
      LISTA = [...rem, ...DOWNLOADS.filter(d => !urls.has(d.url))];
      desenhar();
    })
    .catch(() => {})
    .finally(() => rotear(true));
}

function abrir(i){
  const d = LISTA[i];
  document.getElementById("m-titulo").textContent = d.nome;
  document.getElementById("m-meta").innerHTML = [d.tipo, d.versao, d.tamanho, d.data].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
  mDesc.textContent = d.detalhes || d.descricao;
  const previa = document.getElementById("m-previa");
  previa.innerHTML = d.imagem ? `<img src="${esc(d.imagem)}" alt="Prévia de ${esc(d.nome)}">` : `<span>${esc(d.tipo)}</span>`;
  mLink.href = d.url;
  const bp = document.getElementById("m-copiar-pag");
  bp.hidden = !(d.pagina && d.id);
  bp.textContent = "Copiar link da página";
  const ba = document.getElementById("m-abrir");
  ba.hidden = !(d.pagina && d.id && d.abrir);
  ba.href = `${location.pathname}?d=${encodeURIComponent(d.id || "")}`;
  bp.dataset.url = `${location.origin}${location.pathname}?d=${encodeURIComponent(d.id || "")}`;
  mCopiar.textContent = "Copiar link do arquivo";
  mCopiar.dataset.url = new URL(d.url, location.href).href;
  modal.showModal();
}
grade.addEventListener("click", e => {
  const c = e.target.closest(".cartao");
  if (c) abrir(c.dataset.i);
});
grade.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("cartao")) {
    e.preventDefault();
    abrir(e.target.dataset.i);
  }
});

mCopiar.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(mCopiar.dataset.url);
    mCopiar.textContent = "Link copiado";
  } catch {
    mCopiar.textContent = "Não foi possível copiar";
  }
});
document.getElementById("m-copiar-pag").addEventListener("click", e => copiar(e.target, e.target.dataset.url));
document.getElementById("m-fechar").addEventListener("click", () => modal.close());
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
</script>
</body>
</html>
